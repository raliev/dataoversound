<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Message Transmitter</title>
<style>
  :root {
    --bg: #07080c; --panel: rgba(20,24,33,.82); --line: rgba(255,255,255,.14); --fg: #ffffff; --dim: #b7bdcc;
    --accent: #5eead4; --accent2: #a78bfa; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas#viz { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(7,8,12,.35) 0%, rgba(7,8,12,.8) 75%, rgba(7,8,12,.95) 100%); }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 32px 28px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 750; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 17px; margin: 6px 0 0; }

  .card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 22px; padding: 22px 24px; margin-bottom: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .label { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin-bottom: 14px; }

  button { font: inherit; cursor: pointer; border-radius: 14px; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08);
    color: var(--fg); padding: 12px 22px; font-weight: 650; font-size: 18px; transition: background .15s, transform .1s; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #04110f; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #8ff5e3; }

  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #fname { font-size: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 160px; }
  #fname.empty { color: var(--dim); font-weight: 500; font-size: 18px; }
  #drop.over { outline: 3px dashed var(--accent); outline-offset: 6px; }

  .player { margin-top: 20px; display: none; }
  .player.on { display: block; }
  #playBtn { width: 64px; height: 64px; border-radius: 50%; padding: 0; font-size: 24px; background: var(--accent); color: #04110f; border-color: var(--accent);
    box-shadow: 0 0 28px rgba(94,234,212,.45); flex: none; }
  .bar { position: relative; flex: 1; height: 12px; background: rgba(255,255,255,.14); border-radius: 6px; cursor: pointer; min-width: 160px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 6px; width: 0;
    box-shadow: 0 0 16px rgba(94,234,212,.5); }
  .time { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 650; min-width: 128px; text-align: right; }

  textarea { width: 100%; min-height: 190px; resize: vertical; background: rgba(4,6,10,.75); color: var(--fg);
    border: 2.5px solid rgba(94,234,212,.4); border-radius: 18px; padding: 20px 22px; outline: none;
    font: 650 clamp(28px, 3.4vw, 46px)/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; letter-spacing: -.01em;
    caret-color: var(--accent); transition: border-color .2s, box-shadow .2s; }
  textarea::placeholder { color: rgba(255,255,255,.35); font-weight: 500; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(94,234,212,.15), 0 0 40px rgba(94,234,212,.18); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .chip { border: 1.5px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 14px; font-size: 16px; font-weight: 600; color: var(--fg); }
  .chip.mode { color: #04110f; background: var(--accent); border-color: var(--accent); }
  .warn { color: var(--warn); font-size: 17px; font-weight: 600; margin-top: 12px; display: none; }
  .warn.on { display: block; }

  .tx { margin-top: 22px; display: none; }
  .tx.on { display: block; }
  .txhead { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
  #txLabel { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; min-width: 0; }
  #txLabel .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 14px #ef4444; animation: pulse 1.2s ease-in-out infinite; flex: none; }
  .live.off { background: #6b7280; box-shadow: none; animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  #txLoop { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--accent); flex: none; }
  .bits { display: flex; gap: 2px; height: 46px; align-items: flex-end; overflow: hidden; }
  .bits b { flex: 1; min-width: 1px; background: rgba(255,255,255,.22); border-radius: 2px; height: 38%; transition: background .15s, box-shadow .15s; }
  .bits b.one { height: 100%; }
  .bits b.sync { background: rgba(167,139,250,.65); }
  .bits b.done { background: rgba(94,234,212,.7); }
  .bits b.cur { background: #fff !important; box-shadow: 0 0 14px #fff, 0 0 26px var(--accent); }
  .legend { display: flex; gap: 18px; margin-top: 10px; font-size: 14px; color: var(--dim); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .dl { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #dlStatus { color: var(--dim); font-size: 17px; }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div id="shade"></div>
<div class="wrap">
  <header>
    <div>
      <h1>Hidden Message <span>Transmitter</span></h1>
      <p class="sub">The message is woven into the music itself — inaudibly. A listening device recovers it from sound alone.</p>
    </div>
  </header>

  <div class="card" id="drop">
    <div class="label">Audio</div>
    <div class="row">
      <button id="browse">Browse…</button>
      <span id="fname" class="empty">No file selected — or drop an MP3 here</span>
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a" hidden>
    </div>
    <div class="player" id="player">
      <div class="row">
        <button id="playBtn" aria-label="Play">▶</button>
        <div class="bar" id="bar"><i id="barFill"></i></div>
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Message</div>
    <textarea id="msg" placeholder="Type a message…" spellcheck="false"></textarea>
    <div class="stats" id="stats"></div>
    <div class="warn" id="warn"></div>
    <div class="tx" id="tx">
      <div class="txhead"><span id="txLabel"><span class="live" id="liveDot"></span><span class="t" id="txText">Transmitting</span></span><span id="txLoop"></span></div>
      <div class="bits" id="bits"></div>
      <div class="legend"><span><i style="background:rgba(167,139,250,.8)"></i>sync</span><span><i style="background:rgba(94,234,212,.8)"></i>sent this loop</span><span><i style="background:#fff"></i>on air now</span></div>
    </div>
  </div>

  <div class="card">
    <div class="dl">
      <button class="primary" id="dl" disabled>Download MP3</button>
      <span id="dlStatus">The file carries the message in any player.</span>
    </div>
  </div>
</div>

<script src="wmcore.js"></script>
<script src="textcodec.js"></script>
<script src="vendor/lame.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const S = { ctx: null, node: null, analyser: null, L: null, R: null, name: '', dur: 0, pos: 0, playing: false, schedule: [], W: null, codec: null, packet: null };
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

async function init() {
  const proto = await (await fetch('protocol.json')).json();
  S.W = proto.watermark;
  S.codec = new TextCodec(await (await fetch('vocab.json')).json());
  updateMessage();
}

async function ensureAudio() {
  if (S.ctx) return;
  S.ctx = new AudioContext({ sampleRate: 48000 });
  await S.ctx.audioWorklet.addModule('wmcore.js');
  await S.ctx.audioWorklet.addModule('wm-player.js');
  S.node = new AudioWorkletNode(S.ctx, 'wm-player', { numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { W: S.W } });
  S.node.connect(S.ctx.destination);
  S.analyser = S.ctx.createAnalyser(); S.analyser.fftSize = 4096; S.analyser.smoothingTimeConstant = 0.75;
  const mute = S.ctx.createGain(); mute.gain.value = 0;
  S.node.connect(S.analyser); S.analyser.connect(mute); mute.connect(S.ctx.destination);
  S.node.port.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'pos') { S.pos = m.pos / 48000; S.playing = m.playing; }
    if (m.type === 'ended') { S.playing = false; }
  };
  sendSchedule();
}

async function loadFile(file) {
  await ensureAudio();
  S.name = file.name.replace(/\.[^.]+$/, '');
  $('fname').textContent = `Decoding ${file.name}…`;
  const buf = await S.ctx.decodeAudioData(await file.arrayBuffer());
  S.L = buf.getChannelData(0).slice();
  S.R = (buf.numberOfChannels > 1 ? buf.getChannelData(1) : buf.getChannelData(0)).slice();
  S.dur = buf.duration;
  S.node.port.postMessage({ type: 'load', L: S.L.slice(), R: S.R.slice() });
  $('fname').textContent = file.name; $('fname').classList.remove('empty');
  $('player').classList.add('on');
  $('dl').disabled = false;
  await S.ctx.resume();
  play(true);
  updateMessage();
  $('msg').focus();
}

function play(on) {
  if (!S.node || !S.L) return;
  S.ctx.resume();
  S.node.port.postMessage({ type: on ? 'play' : 'pause' });
  S.playing = on;
}

$('browse').onclick = () => $('file').click();
$('file').onchange = (e) => e.target.files[0] && loadFile(e.target.files[0]);
const drop = $('drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };
$('playBtn').onclick = () => play(!S.playing);
$('bar').onclick = (e) => {
  if (!S.L) return;
  const r = $('bar').getBoundingClientRect(), t = ((e.clientX - r.left) / r.width) * S.dur;
  S.node.port.postMessage({ type: 'seek', pos: Math.round(t * 48000) });
};
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && document.activeElement !== $('msg')) { e.preventDefault(); play(!S.playing); } });

// ---------- сообщение → пакеты ----------
function parseSrt(text) {
  const toSec = (s) => { const [h, m, r] = s.replace('.', ',').split(':'); const [sec, ms] = r.split(','); return +h * 3600 + +m * 60 + +sec + +ms / 1000; };
  const cues = [];
  for (const block of text.replace(/\r/g, '').trim().split(/\n\s*\n/)) {
    const lines = block.split('\n');
    const i = lines.findIndex((l) => /-->/.test(l));
    if (i < 0) continue;
    const m = lines[i].match(/(\d+:\d+:\d+[,.]\d+)\s*-->\s*(\d+:\d+:\d+[,.]\d+)/);
    const body = lines.slice(i + 1).join(' ').replace(/<[^>]+>/g, '').trim();
    if (m && body) cues.push({ start: toSec(m[1]), end: toSec(m[2]), text: body });
  }
  return cues;
}

// укладываем текст в максимальный пакет, отрезая слова с конца
function fit(text) {
  const max = S.W.packet.sizes[S.W.packet.sizes.length - 1];
  let words = text.trim().split(/\s+/), bits = S.codec.encode(text.trim()), cut = false;
  while (bits.length > max && words.length > 1) { words.pop(); bits = S.codec.encode(words.join(' ')); cut = true; }
  return { text: words.join(' '), bits, cut };
}

let debounce = null;
$('msg').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(updateMessage, 700); });

function updateMessage() {
  if (!S.codec) return;
  const raw = $('msg').value;
  const stats = [], warn = [];
  S.schedule = []; S.packet = null;
  if (/\d+:\d+:\d+[,.]\d+\s*-->/.test(raw)) {
    const cues = parseSrt(raw);
    let short = 0;
    for (const c of cues) {
      const f = fit(c.text), pk = WMCore.buildPacket(S.W, f.bits);
      S.schedule.push({ start: c.start, end: c.end, chips: pk.chips, packet: pk, text: f.text });
      if (c.end - c.start < pk.seconds * 1.3) short++;
    }
    stats.push(`<span class="chip mode">SRT · ${cues.length} cues</span>`);
    if (cues.length) stats.push(`<span class="chip">each cue loops within its own time range</span>`);
    if (short) warn.push(`${short} of ${cues.length} cues are shorter than their packet loop — they're unlikely to be received. Sound-only transmission carries a few bits per second; long cues (≈40 s+) work best.`);
  } else if (raw.trim()) {
    const f = fit(raw), pk = WMCore.buildPacket(S.W, f.bits);
    S.packet = pk;
    // в эфире круг начинается заново (с синхрослова) с момента изменения текста — приёмнику
    // не нужно ждать конца старого круга; в «Download» круг начинается с начала трека
    const origin = S.playing ? S.pos + 0.15 : S.pos;
    S.schedule = [{ start: -1e9, end: 1e9, origin, chips: pk.chips, packet: pk, text: f.text }];
    stats.push(`<span class="chip mode">Looped message</span>`,
      `<span class="chip">${f.text.length} chars → ${f.bits.length} bits</span>`,
      `<span class="chip">loops every ${pk.seconds.toFixed(0)} s</span>`);
    if (f.cut) warn.push(`Too long for one packet — sending: “${f.text}”`);
  } else stats.push('<span class="chip">Nothing to send yet</span>');
  $('stats').innerHTML = stats.join('');
  $('warn').innerHTML = warn.join('<br>');
  $('warn').classList.toggle('on', warn.length > 0);
  sendSchedule();
  drawBits();
}

function sendSchedule() {
  if (!S.node) return;
  S.node.port.postMessage({ type: 'schedule', items: S.schedule.map(({ start, end, chips, origin }) => ({ start, end, chips, origin })) });
}

// ---------- визуализация передаваемых бит ----------
let bitEls = [], bitKey = null;
function currentItem() {
  const t = S.pos;
  return S.schedule.find((s) => t >= s.start && t < s.end) || null;
}
function drawBits() {
  const it = currentItem() || S.schedule[0];
  const key = it ? it.packet.bits.join('') : '';
  $('tx').classList.toggle('on', !!it);
  if (key === bitKey) return;
  bitKey = key;
  const box = $('bits'); box.innerHTML = ''; bitEls = [];
  if (!it) return;
  const ns = S.W.packet.sync_bits;
  it.packet.bits.forEach((b, i) => {
    const el = document.createElement('b');
    if (b) el.classList.add('one');
    if (i < ns) el.classList.add('sync');
    box.appendChild(el); bitEls.push(el);
  });
}

// ---------- фон: спектр того, что сейчас звучит ----------
const cv = $('viz'), g = cv.getContext('2d');
const wf = document.createElement('canvas'), wg = wf.getContext('2d');
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  wf.width = Math.max(1, Math.floor(cv.width / 3)); wf.height = Math.max(1, Math.floor(cv.height / 3));
}
addEventListener('resize', resize); resize();
let spec = null;
function drawViz() {
  const W = cv.width, H = cv.height;
  g.fillStyle = '#07080c'; g.fillRect(0, 0, W, H);
  const an = S.analyser;
  if (!an) return;
  if (!spec) spec = new Float32Array(an.frequencyBinCount);
  an.getFloatFrequencyData(spec);
  const nyq = 24000, f0 = 60, f1 = 16000;
  const binAt = (x, w) => Math.min(spec.length - 1, Math.round(((f0 * Math.pow(f1 / f0, x / w)) / nyq) * spec.length));
  const norm = (db) => Math.max(0, Math.min(1, (db + 100) / 70));
  const ww = wf.width, wh = wf.height;
  wg.drawImage(wf, 0, -1);
  const row = wg.createImageData(ww, 1);
  for (let x = 0; x < ww; x++) {
    const v = S.playing ? norm(spec[binAt(x, ww)]) : 0, i = x * 4;
    row.data[i] = 40 + 127 * v * v; row.data[i + 1] = 60 + 174 * v; row.data[i + 2] = 120 + 92 * v; row.data[i + 3] = 255 * Math.pow(v, 1.6) * 0.9;
  }
  wg.putImageData(row, 0, wh - 1);
  g.globalAlpha = 0.5; g.drawImage(wf, 0, 0, W, H); g.globalAlpha = 1;
  const base = H * 0.98, amp = H * 0.28, step = Math.max(2, Math.floor(W / 220));
  const grad = g.createLinearGradient(0, base - amp, 0, base);
  grad.addColorStop(0, 'rgba(94,234,212,.45)'); grad.addColorStop(1, 'rgba(167,139,250,0)');
  g.beginPath(); g.moveTo(0, base);
  for (let x = 0; x <= W; x += step) g.lineTo(x, base - amp * Math.pow(norm(spec[binAt(x, W)]), 1.3));
  g.lineTo(W, base); g.closePath(); g.fillStyle = grad; g.fill();
}

let lastCur = -1;
function frame() {
  drawViz();
  if (S.dur) {
    $('barFill').style.width = `${(100 * S.pos) / S.dur}%`;
    $('time').textContent = `${fmt(S.pos)} / ${fmt(S.dur)}`;
    $('playBtn').textContent = S.playing ? '❚❚' : '▶';
  }
  drawBits();
  const it = currentItem();
  if (it && bitEls.length) {
    const halfDur = (S.W.half_hops * S.W.hop) / 48000;
    const nb = it.packet.bits.length, k0 = Math.floor((S.pos - (it.origin ?? it.start)) / halfDur / 2), k = ((k0 % nb) + nb) % nb;
    if (k !== lastCur) {
      bitEls.forEach((el, i) => { el.classList.toggle('cur', i === k); el.classList.toggle('done', i < k); });
      lastCur = k;
    }
    const ps = it.packet.seconds, loopPos = (((S.pos - (it.origin ?? it.start)) % ps) + ps) % ps;
    const on = S.playing && !!S.L;
    $('liveDot').classList.toggle('off', !on);
    $('txText').textContent = on ? 'ON AIR' : S.L ? 'Paused' : 'Ready — load an MP3 to transmit';
    $('txLoop').textContent = S.L ? `loop ${loopPos.toFixed(0)} / ${it.packet.seconds.toFixed(0)} s` : '';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Download MP3 ----------
$('dl').onclick = async () => {
  if (!S.L) return;
  const btn = $('dl'), st = $('dlStatus');
  btn.disabled = true;
  try {
    const emb = new WMCore.Embedder(S.W, 48000);
    emb.schedule = S.schedule.map(({ start, end, chips }) => ({ start: Math.max(0, start), end, chips }));
    const [yL, yR] = await emb.render(S.L, S.R, (p) => { st.textContent = `Embedding… ${Math.round(p * 100)}%`; });
    let peak = 0;
    for (let i = 0; i < yL.length; i++) peak = Math.max(peak, Math.abs(yL[i]), Math.abs(yR[i]));
    const gn = peak > 0.99 ? 0.99 / peak : 1;
    const enc = new lamejs.Mp3Encoder(2, 48000, 256), parts = [], n = yL.length, CH = 1152;
    const iL = new Int16Array(CH), iR = new Int16Array(CH);
    for (let i = 0; i < n; i += CH) {
      const m = Math.min(CH, n - i);
      for (let j = 0; j < m; j++) { iL[j] = Math.max(-32768, Math.min(32767, yL[i + j] * gn * 32767)); iR[j] = Math.max(-32768, Math.min(32767, yR[i + j] * gn * 32767)); }
      const b = enc.encodeBuffer(iL.subarray(0, m), iR.subarray(0, m));
      if (b.length) parts.push(new Uint8Array(b));
      if ((i / CH) % 400 === 0) { st.textContent = `Encoding MP3… ${Math.round((100 * i) / n)}%`; await new Promise((r) => setTimeout(r, 0)); }
    }
    parts.push(new Uint8Array(enc.flush()));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(parts, { type: 'audio/mpeg' }));
    a.download = `${S.name || 'audio'}-hidden.mp3`;
    a.click();
    st.textContent = 'Done — the file carries the message in any player.';
  } catch (e) {
    st.textContent = `Failed: ${e.message || e}`;
  } finally { btn.disabled = false; }
};

init();
</script>
</body>
</html>
