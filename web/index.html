<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Hidden Message Receiver</title>
<style>
  :root { --bg: #07080c; --fg: #f4f5f7; --dim: #8a90a0; --accent: #5eead4; --accent2: #a78bfa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #shade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, rgba(7,8,12,.15) 0%, rgba(7,8,12,.7) 70%, rgba(7,8,12,.92) 100%); }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 20px 0; z-index: 2; }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #debugBtn { background: none; border: 0; color: var(--dim); font: 13px inherit; cursor: pointer; padding: 6px; }

  #ticker { position: fixed; left: 0; right: 0; bottom: 22%; display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 0 24px; z-index: 2; pointer-events: none; }
  .line { max-width: min(92vw, 1100px); text-align: center; font-weight: 650; letter-spacing: -.01em;
    text-shadow: 0 2px 24px rgba(0,0,0,.6); transition: opacity .7s ease, font-size .7s ease, transform .7s cubic-bezier(.2,.7,.2,1), filter .7s; }
  .line[data-age="0"] { font-size: clamp(28px, 5.4vw, 64px); opacity: 1; }
  .line[data-age="1"] { font-size: clamp(20px, 3.2vw, 38px); opacity: .42; }
  .line[data-age="2"] { font-size: clamp(17px, 2.5vw, 30px); opacity: .2; filter: blur(.5px); }
  .line[data-age="3"] { font-size: clamp(15px, 2vw, 24px); opacity: .08; filter: blur(1px); }
  .line.enter { opacity: 0 !important; transform: translateY(24px) scale(.98); filter: blur(6px); }
  .line .src { display: block; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); opacity: .8; margin-top: 6px; }
  .line[data-age="0"].pulse { animation: pulse .9s ease; }
  @keyframes pulse { 0% { text-shadow: 0 0 0 rgba(94,234,212,0); } 30% { text-shadow: 0 0 28px rgba(94,234,212,.55); } 100% { text-shadow: 0 2px 24px rgba(0,0,0,.6); } }

  .line .w { transition: color .4s, filter .4s, opacity .4s; }
  .line .w.res { color: var(--accent); opacity: .75; filter: blur(1.2px); font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
  .line .cur { display: inline-block; width: .08em; height: .9em; margin-left: .12em; vertical-align: -.08em; background: var(--accent); animation: blink 1s steps(1) infinite; }
  .line.final { animation: settle .9s ease; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes settle { 0% { text-shadow: 0 0 0 rgba(94,234,212,0); } 25% { text-shadow: 0 0 34px rgba(94,234,212,.7); } 100% { text-shadow: 0 2px 24px rgba(0,0,0,.6); } }
  #idle { position: fixed; left: 0; right: 0; bottom: 24%; text-align: center; color: var(--dim); font-size: 18px; z-index: 2; transition: opacity .6s; }
  #idle.hide { opacity: 0; }

  footer { position: fixed; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 2; }
  .pill { display: flex; align-items: center; gap: 12px; background: rgba(18,21,28,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 10px 18px 10px 14px; font-size: 13.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #5b6272; transition: background .4s, box-shadow .4s; }
  .dot.tuning { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
  .dot.locked { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .meter { width: 90px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .5s; }

  #debug { position: fixed; left: 20px; right: 20px; bottom: 84px; z-index: 3; display: none; background: rgba(14,16,22,.94);
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--dim);
    max-height: 40vh; overflow: auto; white-space: pre-wrap; }
  #debug.show { display: block; }

  #start { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; }
  #start h2 { font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
  #start p { color: var(--dim); max-width: 34ch; }
  #start button { background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 16px 32px; font: 600 17px inherit; cursor: pointer; }
  #err { color: #f5b454; font-size: 14px; max-width: 40ch; }
</style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="shade"></div>
  <header><h1>Hidden Message Receiver</h1><button id="debugBtn">debug</button></header>
  <div id="idle">Listening for a hidden message…</div>
  <div id="ticker"></div>
  <footer>
    <div class="pill"><span class="dot" id="dot"></span><span id="status">Idle</span><span class="meter"><i id="meter"></i></span><span id="heard"></span></div>
  </footer>
  <div id="debug"></div>
  <div id="start">
    <h2>Hidden Message Receiver</h2>
    <p>Listens through the microphone and recovers text hidden inside whatever is playing.</p>
    <button id="go">Start listening</button>
    <div id="err"></div>
  </div>

<script src="wmcore.js"></script>
<script src="textcodec.js"></script>
<script src="decoder.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const S = { sr: 48000, lines: [], lastText: null, log: [], analyser: null, locked: false, lastDecode: 0 };
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function log(s) { S.log.unshift(`${new Date().toLocaleTimeString()}  ${s}`); S.log.length = Math.min(S.log.length, 40); }
$('debugBtn').onclick = () => $('debug').classList.toggle('show');

// ---------- лента текста: новые строки снизу, старые уходят вверх и гаснут (FLIP-анимация) ----------
function addLine() {
  const box = $('ticker');
  const before = new Map(S.lines.map((el) => [el, el.getBoundingClientRect().top]));
  const el = document.createElement('div');
  el.className = 'line enter';
  box.appendChild(el);
  S.lines.push(el);
  while (S.lines.length > 4) S.lines.shift().remove();
  S.lines.forEach((l, i) => { l.dataset.age = String(S.lines.length - 1 - i); });
  for (const l of S.lines) {
    if (!before.has(l)) continue;
    const dy = before.get(l) - l.getBoundingClientRect().top;
    l.style.transition = 'none'; l.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { l.style.transition = ''; l.style.transform = ''; });
  }
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
  $('idle').classList.add('hide');
  return el;
}

function pushLine(text, src) {
  if (text === S.lastText) {
    const top = S.lines[S.lines.length - 1];
    if (top) { top.classList.remove('pulse'); void top.offsetWidth; top.classList.add('pulse'); }
    return;
  }
  S.lastText = text;
  const el = addLine();
  el.textContent = text;
  if (src) { const s = document.createElement('span'); s.className = 'src'; s.textContent = src; el.appendChild(s); }
}

// живая строка: надёжные слова — как есть, недослушанные — «мельтешащие» буквы, в конце курсор
const SCR = 'abcdefghijklmnopqrstuvwxyz';
const scramble = (n) => Array.from({ length: Math.max(2, n) }, () => SCR[(Math.random() * SCR.length) | 0]).join('');
function renderLive(el, words) {
  const vis = [];
  for (const w of words) { if (w.state === 'hidden') break; vis.push(w); }
  el.textContent = '';
  vis.forEach((w, i) => {
    if (i && !w.glue) el.appendChild(document.createTextNode(' '));
    const sp = document.createElement('span');
    sp.className = 'w' + (w.state === 'solid' ? '' : ' res');
    sp.dataset.len = String(w.text.length);
    sp.textContent = w.state === 'solid' ? w.text : scramble(w.text.length);
    el.appendChild(sp);
  });
  const c = document.createElement('span'); c.className = 'cur'; el.appendChild(c);
}
setInterval(() => document.querySelectorAll('.line .w.res').forEach((sp) => { sp.textContent = scramble(+sp.dataset.len); }), 90);
const samePacket = (a, b, H) => a && b && a.K === b.K && Math.abs(a.x - b.x) <= H;

// ---------- визуализация ----------
const cv = $('viz'), g = cv.getContext('2d');
const wf = document.createElement('canvas'), wg = wf.getContext('2d');
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  wf.width = Math.max(1, Math.floor(cv.width / 3)); wf.height = Math.max(1, Math.floor(cv.height / 3));
}
addEventListener('resize', resize); resize();
let spec = null, wave = null;
function draw() {
  requestAnimationFrame(draw);
  const W = cv.width, H = cv.height;
  g.fillStyle = '#07080c'; g.fillRect(0, 0, W, H);
  const an = S.analyser;
  if (!an) return;
  if (!spec) { spec = new Float32Array(an.frequencyBinCount); wave = new Float32Array(an.fftSize); }
  an.getFloatFrequencyData(spec); an.getFloatTimeDomainData(wave);
  const nyq = S.sr / 2, f0 = 60, f1 = 16000;
  const binAt = (x, w) => Math.min(spec.length - 1, Math.round(((f0 * Math.pow(f1 / f0, x / w)) / nyq) * spec.length));
  const norm = (db) => Math.max(0, Math.min(1, (db + 100) / 70));
  // водопад: сдвиг вверх, новая строка снизу
  const ww = wf.width, wh = wf.height;
  wg.drawImage(wf, 0, -1);
  const row = wg.createImageData(ww, 1);
  for (let x = 0; x < ww; x++) {
    const v = norm(spec[binAt(x, ww)]), i = x * 4;
    row.data[i] = 40 + 127 * v * v; row.data[i + 1] = 60 + 174 * v; row.data[i + 2] = 120 + 92 * v; row.data[i + 3] = 255 * Math.pow(v, 1.6) * 0.9;
  }
  wg.putImageData(row, 0, wh - 1);
  g.globalAlpha = 0.55; g.imageSmoothingEnabled = true; g.drawImage(wf, 0, 0, W, H); g.globalAlpha = 1;
  // спектр
  const base = H * 0.92, amp = H * 0.32;
  const grad = g.createLinearGradient(0, base - amp, 0, base);
  grad.addColorStop(0, 'rgba(94,234,212,.55)'); grad.addColorStop(1, 'rgba(167,139,250,0)');
  g.beginPath(); g.moveTo(0, base);
  const step = Math.max(2, Math.floor(W / 220));
  for (let x = 0; x <= W; x += step) g.lineTo(x, base - amp * Math.pow(norm(spec[binAt(x, W)]), 1.3));
  g.lineTo(W, base); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath();
  for (let x = 0; x <= W; x += step) { const y = base - amp * Math.pow(norm(spec[binAt(x, W)]), 1.3); x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.strokeStyle = 'rgba(94,234,212,.9)'; g.lineWidth = Math.max(1.5, W / 900); g.stroke();
  // осциллограмма
  g.beginPath();
  const mid = H * 0.5;
  for (let i = 0; i < wave.length; i += 4) { const x = (i / wave.length) * W, y = mid + wave[i] * H * 0.18; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = Math.max(1, W / 1400); g.stroke();
}
requestAnimationFrame(draw);

// ---------- приём ----------
async function start() {
  const P = await (await fetch('protocol.json')).json();
  const codec = new TextCodec(await (await fetch('vocab.json')).json());
  const testFile = new URLSearchParams(location.search).get('file');   // отладка: звук из файла
  let ctx, src;
  if (testFile) {
    ctx = new AudioContext({ sampleRate: 48000 });
    const el = new Audio(testFile); src = ctx.createMediaElementSource(el); await el.play();
  } else {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    try { ctx = new AudioContext({ sampleRate: 48000 }); src = ctx.createMediaStreamSource(stream); }
    catch { ctx = new AudioContext(); src = ctx.createMediaStreamSource(stream); }
  }
  await ctx.resume();
  S.sr = ctx.sampleRate;
  await ctx.audioWorklet.addModule('capture-worklet.js');
  const node = new AudioWorkletNode(ctx, 'capture');
  const mute = ctx.createGain(); mute.gain.value = 0;
  S.analyser = ctx.createAnalyser(); S.analyser.fftSize = 4096; S.analyser.smoothingTimeConstant = 0.75;
  src.connect(node); src.connect(S.analyser); node.connect(mute); S.analyser.connect(mute); mute.connect(ctx.destination);

  const H = P.watermark.half_hops;
  const pd = new DosDecoder.PacketDecoder(P.watermark, S.sr, { codec, onMessage: (m) => {
    S.locked = true; S.lastDecode = pd.heard;
    if (m.text !== S.lastText) log(`decoded (K=${m.K}, z=${m.z.toFixed(1)}, after ${pd.heard.toFixed(0)} s): ${m.text}`);
    if (S.live && samePacket(S.live, m, H)) {             // живая строка становится окончательной
      const el = S.live.el;
      el.textContent = m.text; el.classList.remove('final'); void el.offsetWidth; el.classList.add('final');
      S.lastText = m.text;
    } else if (!samePacket(S.confirmed, m, H) || m.text !== S.lastText) pushLine(m.text);
    S.confirmed = { K: m.K, x: m.x }; S.live = null;
  }, onChange: () => {                                  // передатчик сменил сообщение — слушаем заново
    log('message changed — re-tuning');
    S.confirmed = null; S.live = null; S.locked = false;
  } });
  const us = new DosDecoder.UltrasoundDecoder(P.ultrasound, S.sr, { onMessage: (m) => { log(`ultrasound: ${m.text}`); pushLine(m.text, 'ultrasound'); } });
  node.port.onmessage = (e) => { pd.push(e.data); us.push(e.data); };
  setInterval(() => us.process(), 150);
  setInterval(() => {
    pd.process();
    const t = pd.tentative;
    if (t && t.ok && !samePacket(S.confirmed, t, H)) {    // догадка для нового пакета — слово за словом
      if (!S.live || !samePacket(S.live, t, H)) { S.live = { K: t.K, x: t.x, el: addLine() }; log(`receiving (K=${t.K}, sync z=${t.zs.toFixed(1)})`); }
      S.live.x = t.x;
      renderLive(S.live.el, t.words);
    }
    // у чистого шума максимум синхро по всем сдвигам и размерам пакета ≤ 4.5 — шкала от него
    const z = pd.best.z, pct = S.locked || S.live ? 1 : Math.max(0, Math.min(0.95, (z - 4.3) / 2));
    if (S.locked && pd.heard - S.lastDecode > 40) S.locked = false;
    $('meter').style.width = `${Math.round(pct * 100)}%`;
    $('dot').className = 'dot ' + (S.locked && !S.live ? 'locked' : pct > 0.2 || S.live ? 'tuning' : '');
    $('status').textContent = S.live ? 'Receiving…' : S.locked ? 'Message received' : pct > 0.2 ? 'Tuning in…' : 'Listening…';
    $('heard').textContent = fmt(pd.heard);
    $('debug').textContent = `${S.sr} Hz · sync z=${z.toFixed(2)} (packet K=${pd.best.K}) · heard ${pd.heard.toFixed(0)} s` +
      (pd.lock ? ` · tracking r=${pd.lock.r.toFixed(2)}` : '') + '\n' + S.log.join('\n');
  }, 700);
  log(`microphone: ${S.sr} Hz`);
  try { await navigator.wakeLock?.request('screen'); } catch {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { ctx.resume(); navigator.wakeLock?.request('screen').catch(() => {}); } });
}

$('go').onclick = async () => {
  $('err').textContent = '';
  try { await start(); $('start').remove(); }
  catch (e) { $('err').textContent = !window.isSecureContext ? 'Microphone access needs HTTPS — open the https:// address.' : `Couldn't start the microphone: ${e.message || e}`; }
};
if (new URLSearchParams(location.search).has('autostart')) $('go').click();
</script>
</body>
</html>
